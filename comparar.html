<body data-page="comparar">
    <nav class="destiny-navbar">
        <div id="nav-brand-container"></div>
        <div id="nav-links-container"></div>
        <div class="nav-actions">
            <div id="nav-login-container"></div>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="page-title" data-i18n="compare.titulo">COMPARAR</h1>
        <p class="page-subtitle" data-i18n="compare.desc">Elegí 2 items para verlos lado a lado.</p>
    </header>

    <main class="compare-page" id="main-content">
        <div class="compare-controls" role="form" data-i18n="compare.aria.form" data-i18n-attr="aria-label" aria-label="Elegir títulos a comparar">
            <div class="compare-picker">
                <div class="cmp-field cmp-field--cat">
                    <label class="compare-label" for="cat1" data-i18n="compare.label.catalogo">Catálogo</label>
                    <select id="cat1" class="compare-select">
                        <option value="anime" data-i18n="compare.opt.anime">Anime</option>
                        <option value="manga" data-i18n="compare.opt.manga">Manga</option>
                        <option value="novelas" data-i18n="compare.opt.novelas">Novelas</option>
                    </select>
                </div>
                <div class="cmp-field cmp-field--search">
                    <label class="compare-label" for="search1" data-i18n="compare.label.primero">Primer título</label>
                    <div class="cmp-search-wrap">
                        <span class="cmp-search-icon"><i data-lucide="search"></i></span>
                        <input id="search1" class="cmp-search-input" type="search" data-i18n="compare.buscar_ph" data-i18n-attr="placeholder" placeholder="Buscá un título..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug1">
                        <div class="cmp-suggestions" id="sug1" role="listbox"></div>
                    </div>
                </div>
            </div>

            <div class="compare-vs" aria-hidden="true">VS</div>

            <div class="compare-picker">
                <div class="cmp-field cmp-field--cat">
                    <label class="compare-label" for="cat2" data-i18n="compare.label.catalogo">Catálogo</label>
                    <select id="cat2" class="compare-select">
                        <option value="anime" data-i18n="compare.opt.anime">Anime</option>
                        <option value="manga" data-i18n="compare.opt.manga">Manga</option>
                        <option value="novelas" data-i18n="compare.opt.novelas">Novelas</option>
                    </select>
                </div>
                <div class="cmp-field cmp-field--search">
                    <label class="compare-label" for="search2" data-i18n="compare.label.segundo">Segundo título</label>
                    <div class="cmp-search-wrap">
                        <span class="cmp-search-icon"><i data-lucide="search"></i></span>
                        <input id="search2" class="cmp-search-input" type="search" data-i18n="compare.buscar_ph" data-i18n-attr="placeholder" placeholder="Buscá un título..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug2">
                        <div class="cmp-suggestions" id="sug2" role="listbox"></div>
                    </div>
                </div>
            </div>

            <button class="compare-btn" id="doCompare" type="button" data-i18n="compare.boton">Comparar</button>
        </div>

        <div class="compare-actions">
            <button class="compare-action" id="swapSides" type="button" data-i18n="compare.aria.intercambiar" data-i18n-attr="aria-label" aria-label="Intercambiar los dos lados">
                <i data-lucide="arrow-left-right"></i><span data-i18n="compare.intercambiar">Intercambiar</span>
            </button>
            <button class="compare-action" id="copyLink" type="button" data-i18n="compare.aria.copiar" data-i18n-attr="aria-label" aria-label="Copiar enlace de la comparación">
                <i data-lucide="link"></i><span data-i18n="compare.copiar">Copiar enlace</span>
            </button>
        </div>

        <section class="compare-grid" aria-live="polite" data-i18n="compare.aria.resultado" data-i18n-attr="aria-label" aria-label="Resultado comparación">
            <div class="compare-card" id="compareA"></div>
            <div class="compare-card" id="compareB"></div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="js/core/config.js?v=76044a09"></script>
    <script src="js/core/i18n.js?v=76044a09"></script>

    <script src="js/pages/script.js?v=76044a09" defer></script>
    <script src="js/pages/comparar.js?v=76044a09" defer></script>
</body>
</html>
