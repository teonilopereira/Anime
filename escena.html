<body data-page="escena">

    <header class="page-header">
        <h1 class="page-title">¿QUÉ ANIME ES?</h1>
        <p class="page-subtitle">Subí una captura y te decimos de qué anime, episodio y minuto es.</p>
    </header>

    <main class="escena-page" id="main-content">
        <form class="escena-form" id="escenaForm" novalidate>
            <label class="escena-drop" id="escenaDrop" for="escenaFile">
                <input id="escenaFile" class="escena-file" type="file" accept="image/*">
                <span class="escena-drop-icon" aria-hidden="true"><i data-lucide="upload"></i></span>
                <span class="escena-drop-text"><strong>Elegí una imagen</strong>, arrastrala acá o pegala con Ctrl+V</span>
                <span class="escena-drop-hint">JPG, PNG, WebP o GIF · hasta 25 MB</span>
                <img class="escena-preview" id="escenaPreview" alt="Imagen a buscar" hidden>
            </label>

            <div class="escena-url">
                <label class="escena-url-label" for="escenaUrl">…o pegá el link de una imagen</label>
                <div class="escena-url-row">
                    <input id="escenaUrl" class="escena-url-input" type="url" inputmode="url" placeholder="https://…" autocomplete="off">
                    <button class="escena-btn" id="escenaBuscar" type="submit"><i data-lucide="scan-search"></i> Buscar</button>
                </div>
            </div>

            <p class="escena-nota">La imagen se envía a <a href="https://trace.moe" target="_blank" rel="noopener noreferrer">trace.moe</a> para buscarla; Mirudoku no la guarda. Funciona mejor con capturas completas de la serie, sin recortes ni edición.</p>
        </form>

        <p class="escena-estado" id="escenaEstado" role="status" aria-live="polite"></p>
        <section class="escena-resultados" id="escenaResultados" aria-label="Resultados"></section>
    </main>
