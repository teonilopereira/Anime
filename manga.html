<body data-page="manga">
    <nav class="destiny-navbar">
        <div id="nav-brand-container"></div>
        <div id="nav-links-container"></div>
        <div class="nav-actions">
            <div id="nav-login-container"></div>
        </div>
    </nav>

    <header class="cx-top">
        <div class="cx-top-inner">
            <div class="cx-top-row">
                <div class="cx-heading">
                    <h1 class="cx-title" data-i18n="catalog.title.manga">CATÁLOGO DE MANGA</h1>
                    <p class="cx-subtitle" data-i18n="catalog.subtitle.manga">Explorá, descubrí y guardá tus mangas favoritos.</p>
                </div>
                <div class="catalog-search-filter-container cx-search">
                    <div class="catalog-search-wrap">
                        <div class="catalog-search-inner">
                            <span class="catalog-search-icon"><i data-lucide="search"></i></span>
                            <input id="catalogSearch" class="catalog-search-input" type="search" placeholder="Buscar manga..." data-i18n="catalog.buscar.manga" data-i18n-attr="placeholder" autocomplete="off">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="cx-layout">
        <aside class="cx-side" aria-label="Filtros" data-i18n="catalog.aside" data-i18n-attr="aria-label">
            <section class="cx-side-sec" aria-labelledby="cxBrowseTitle">
                <h2 class="cx-side-title" id="cxBrowseTitle" data-i18n="catalog.descubrir">DESCUBRIR</h2>
                <div class="catalog-browse-tabs q-tabs cx-browse" id="browseTabs" role="tablist" aria-label="Modo de descubrimiento" data-i18n="catalog.browse.aria" data-i18n-attr="aria-label" aria-orientation="vertical">
                    <button class="browse-tab q-tab" type="button" role="tab" data-browse="" data-i18n="catalog.browse.populares">Populares</button>
                    <button class="browse-tab q-tab" type="button" role="tab" data-browse="tendencias" data-i18n="catalog.browse.tendencias">Tendencias</button>
                    <button class="browse-tab q-tab" type="button" role="tab" data-browse="puntuados" data-i18n="catalog.browse.puntuados">Mejor puntuados</button>
                </div>
            </section>

            <button id="mainFilterToggle" type="button" class="advanced-filter-toggle cx-filter-toggle" aria-expanded="false" aria-controls="filterDropdown">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                <span data-i18n="catalog.filtros_btn">Filtros y géneros</span>
            </button>

            <div class="advanced-filter-dropdown cx-filters" id="filterDropdown" style="display: none;">
                <section class="cx-side-sec">
                    <div class="cx-side-head">
                        <h2 class="cx-side-title" data-i18n="catalog.refinar">REFINAR</h2>
                        <button id="clearFiltersBtn" class="clear-filters-btn cx-clear" type="button" data-i18n="catalog.limpiar">Limpiar Filtros</button>
                    </div>
                    <div class="filter-advanced-grid cx-fields">
                        <label class="filter-adv-field">
                            <span class="filter-adv-label" data-i18n="catalog.orden">Orden</span>
                            <select id="filterSort" class="filter-adv-select">
                                <option value="" data-i18n="catalog.orden.popularidad">Popularidad</option>
                                <option value="TRENDING_DESC" data-i18n="catalog.orden.tendencia">Tendencia</option>
                                <option value="SCORE_DESC" data-i18n="catalog.orden.puntuados">Mejor puntuados</option>
                                <option value="START_DATE_DESC" data-i18n="catalog.orden.recientes">Más recientes</option>
                                <option value="TITLE_ROMAJI" data-i18n="catalog.orden.az">A – Z</option>
                            </select>
                        </label>
                        <label class="filter-adv-field">
                            <span class="filter-adv-label" data-i18n="catalog.anio">Año</span>
                            <select id="filterYear" class="filter-adv-select">
                                <option value="" data-i18n="catalog.todos">Todos</option>
                            </select>
                        </label>
                        <label class="filter-adv-field filter-anime-only">
                            <span class="filter-adv-label" data-i18n="catalog.temporada">Temporada</span>
                            <select id="filterSeason" class="filter-adv-select">
                                <option value="" data-i18n="catalog.todas">Todas</option>
                                <option value="WINTER" data-i18n="catalog.temporada.invierno">Invierno</option>
                                <option value="SPRING" data-i18n="catalog.temporada.primavera">Primavera</option>
                                <option value="SUMMER" data-i18n="catalog.temporada.verano">Verano</option>
                                <option value="FALL" data-i18n="catalog.temporada.otono">Otoño</option>
                            </select>
                        </label>
                        <label class="filter-adv-field filter-anime-only">
                            <span class="filter-adv-label" data-i18n="catalog.formato">Formato</span>
                            <select id="filterFormat" class="filter-adv-select">
                                <option value="" data-i18n="catalog.todos">Todos</option>
                                <option value="TV">Serie TV</option>
                                <option value="MOVIE" data-i18n="catalog.formato.pelicula">Película</option>
                                <option value="OVA">OVA</option>
                                <option value="ONA">ONA</option>
                                <option value="SPECIAL" data-i18n="catalog.formato.especial">Especial</option>
                                <option value="TV_SHORT" data-i18n="catalog.formato.tvcorta">TV corta</option>
                                <option value="MUSIC" data-i18n="catalog.formato.musical">Musical</option>
                            </select>
                        </label>
                    </div>
                </section>

                <section class="cx-side-sec">
                    <h2 class="cx-side-title" data-i18n="catalog.genero">GÉNERO</h2>
                    <div class="filter-genre-search">
                        <svg class="filter-genre-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="search" id="filterGenreSearch" class="filter-genre-search-input" placeholder="Buscar género..." aria-label="Buscar género" data-i18n="catalog.buscar_genero" data-i18n-attr="placeholder" autocomplete="off">
                    </div>
                    <div class="fancy-filter-genres" id="filterGenres"></div>
                    <button type="button" id="toggleGenresBtn" class="toggle-genres-btn" hidden>Ver todos ▼</button>
                </section>

                <label class="cx-side-sec cx-nsfw">
                    <input type="checkbox" id="nsfwToggle">
                    <span>
                        <span class="cx-nsfw-title" data-i18n="catalog.nsfw.titulo">Mostrar NSFW</span>
                        <span class="cx-nsfw-desc" data-i18n="catalog.nsfw.desc">Activa para mostrar contenido para adultos.</span>
                    </span>
                </label>
            </div>
        </aside>

        <div class="catalog-content cx-main">
            <div class="cx-results-bar">
                <h2 class="cx-results-title" id="catalogHeading">Populares</h2>
                <div class="cx-view" role="group" aria-label="Vista" data-i18n="catalog.vista" data-i18n-attr="aria-label">
                    <button type="button" id="viewCards" aria-pressed="true" aria-label="Ver como fichas" title="Ver como fichas" data-i18n="catalog.vista.fichas" data-i18n-attr="aria-label,title">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="7" height="7"/><path d="M13 5h8M13 9h6"/><rect x="3" y="13" width="7" height="7"/><path d="M13 14h8M13 18h6"/></svg>
                    </button>
                    <button type="button" id="viewCovers" aria-pressed="false" aria-label="Ver como portadas" title="Ver como portadas" data-i18n="catalog.vista.portadas" data-i18n-attr="aria-label,title">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="9"/><rect x="3" y="15" width="7" height="6"/><rect x="14" y="15" width="7" height="6"/></svg>
                    </button>
                </div>
            </div>
            <div id="activeGenreSlot"></div>
            <main class="gallery cx-gallery" id="main-content" data-view="fichas"></main>
            <div id="scroll-sentinel" class="scroll-sentinel"></div>
        </div>
    </div>
    <div id="footer-container"></div>

</body>
