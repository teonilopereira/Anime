# Configuracion de Netlify para Anime Destiny.
#
# Solo define cabeceras de seguridad. NO se define un comando de build a
# proposito: los artefactos (css/bundle.min.css, js/core-bundle.min.js,
# js/vendor/) se generan localmente con `npm run build` y se versionan en el
# repo, asi que Netlify solo publica archivos estaticos.

[[headers]]
  for = "/*"
  [headers.values]
    # Muro anti-XSS/inyeccion: solo se ejecuta script propio y el CDN de jsdelivr;
    # las conexiones salientes quedan limitadas a Supabase y las APIs que la app
    # realmente usa. Debe mantenerse en sincronia con vercel.json.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data:; connect-src 'self' https://llytokoztnjuczuppzgs.supabase.co wss://llytokoztnjuczuppzgs.supabase.co https://graphql.anilist.co https://api.mangadex.org https://api.mymemory.translated.net https://api.animethemes.moe https://api.jikan.moe https://kitsu.io; media-src 'self' https://a.animethemes.moe; font-src 'self' https://fonts.gstatic.com data:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none';"
    # Forzar HTTPS por 2 anios (incluye subdominios).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Impide que el navegador "adivine" el tipo MIME (vector de XSS con archivos subidos).
    X-Content-Type-Options = "nosniff"
    # No filtrar la URL completa al navegar a sitios externos.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Defensa contra clickjacking (complementa frame-ancestors del CSP).
    X-Frame-Options = "SAMEORIGIN"
    # Desactivar APIs del navegador que la app no usa.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
