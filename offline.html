<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="apple-touch-icon" href="images/icon-192.png">

    <style>
        /* Estilos propios e inline: la página debe verse bien aunque el bundle
           no esté en caché (primera visita sin red). */
        .offline-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 0%, rgba(188, 19, 254, 0.12), transparent 60%), #08061a;
        }
        .offline-card {
            max-width: 460px;
            width: 100%;
            text-align: center;
            padding: 40px 28px;
            border-radius: 16px;
            background: rgba(10, 5, 25, 0.82);
            border: 1px solid rgba(188, 19, 254, 0.25);
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.15);
        }
        .offline-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            margin-bottom: 22px;
            border-radius: 22px;
            background: rgba(188, 19, 254, 0.12);
            border: 1px solid rgba(188, 19, 254, 0.35);
            box-shadow: 0 0 26px rgba(188, 19, 254, 0.28);
        }
        .offline-icon svg { width: 44px; height: 44px; color: #bc13fe; }
        .offline-card h1 {
            margin: 0 0 12px;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 1.6rem;
            color: #00f2ff;
            text-shadow: 0 0 14px rgba(0, 242, 255, 0.4);
        }
        .offline-card p {
            margin: 0 0 26px;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #c9bfe0;
        }
        .offline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .offline-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 26px;
            border-radius: 999px;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            text-decoration: none;
            transition: all .2s;
        }
        .offline-btn--primary {
            border: 0;
            color: #fff;
            background: linear-gradient(135deg, #bc13fe, #7b2ff7);
            box-shadow: 0 0 16px rgba(188, 19, 254, 0.45);
        }
        .offline-btn--primary:hover { filter: brightness(1.1); }
        .offline-btn--ghost {
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.03);
            color: #c9bfe0;
        }
        .offline-btn--ghost:hover { border-color: rgba(0, 242, 255, 0.4); color: #00f2ff; }
    </style>
    <script src="js/core/theme.js?v=8e87222d"></script>
    <meta name="google-site-verification" content="x6Ye451jPznGAmYSkuq4o_Q50Bn_wR8mI1nRVHGq2F0">
</head>
<body class="menu-page" data-page="offline">
    <main class="offline-wrap" id="main-content">
        <div class="offline-card">
            <span class="offline-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m2 2 20 20"/>
                    <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
                    <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
                    <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
                    <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
                    <path d="M5 13a10 10 0 0 1 5.24-2.76"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                </svg>
            </span>
            <h1 data-i18n="offline.title">Sin conexión</h1>
            <p data-i18n="offline.text">No pudimos cargar esta página. Revisá tu conexión a internet e intentá de nuevo.</p>
            <div class="offline-actions">
                <button type="button" id="offlineRetry" class="offline-btn offline-btn--primary" data-i18n="offline.retry">Reintentar</button>
                <a href="index.html" class="offline-btn offline-btn--ghost" data-i18n="offline.home">Ir al inicio</a>
            </div>
        </div>
    </main>

    <script src="js/core/i18n.js?v=8e87222d"></script>
    <script src="js/pages/offline.js?v=8e87222d"></script>
</body>
</html>
