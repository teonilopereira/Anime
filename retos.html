<head>
    <meta charset="UTF-8">

    <meta name="robots" content="index,follow">
    <meta property="og:title" content="Anime Destiny | Retos del día">
    <meta property="og:description" content="Adiviná el anime del día, cumplí misiones para ganar EXP y compartí tu resumen del mes.">
    <meta name="twitter:title" content="Anime Destiny | Retos del día">
    <meta name="twitter:description" content="Adiviná el anime del día, cumplí misiones para ganar EXP y compartí tu resumen del mes.">
    <link rel="canonical" href="https://animedestiny.netlify.app/retos.html">
    <title>Anime Destiny | Retos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="theme-color" content="#bc13fe">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://animedestiny.netlify.app/retos.html">
    <meta property="og:site_name" content="Anime Destiny">
    <meta property="og:image" content="https://animedestiny.netlify.app/images/icon-512.png">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="css/bundle.min.css?v=a5335bc2">
    <link rel="stylesheet" href="css/retos.css?v=a5335bc2">

    <link rel="preconnect" href="https://graphql.anilist.co" crossorigin>
    <link rel="preconnect" href="https://s4.anilist.co">
    <link rel="preload" href="fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/rajdhani-500-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css?v=a5335bc2">

    <script src="js/vendor/lucide.min.js?v=a5335bc2" defer></script>
    <script src="js/core/theme.js?v=a5335bc2"></script>
    <meta name="google-site-verification" content="x6Ye451jPznGAmYSkuq4o_Q50Bn_wR8mI1nRVHGq2F0">
</head>
<body data-page="retos">
    <nav class="destiny-navbar">
        <div id="nav-brand-container"></div>
        <div id="nav-links-container"></div>
        <div class="nav-actions">
            <div id="nav-login-container"></div>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="page-title" data-i18n="retos.titulo">RETOS DEL DÍA</h1>
        <p class="page-subtitle" data-i18n="retos.desc">Un anime nuevo para adivinar cada día, misiones que dan EXP y tu resumen del mes.</p>
    </header>

    <main class="retos-page" id="main-content">
        <!-- Adiviná el anime (js/pages/retos.js) -->
        <section class="reto-card quiz" id="quiz" aria-labelledby="quizTitle">
            <div class="reto-head">
                <h2 id="quizTitle" class="reto-title"><i data-lucide="target"></i> <span data-i18n="retos.quiz">Adiviná el anime</span> <span id="quizNumber" class="reto-num"></span></h2>
                <span id="quizTries" class="reto-pill"></span>
            </div>
            <div id="quizBody" class="quiz-body" aria-live="polite">
                <p class="reto-loading" data-i18n="retos.cargando">Cargando el reto de hoy…</p>
            </div>
        </section>

        <!-- Adiviná el personaje, modo libre por serie (js/pages/retos.js) -->
        <section class="reto-card" id="chars" aria-labelledby="charsTitle">
            <div class="reto-head">
                <h2 id="charsTitle" class="reto-title"><i data-lucide="users"></i> <span data-i18n="retos.personajes">Adiviná el personaje</span></h2>
            </div>
            <div id="charBody"></div>
        </section>

        <!-- Misiones -->
        <section class="reto-card" id="missions" aria-labelledby="missionsTitle">
            <div class="reto-head">
                <h2 id="missionsTitle" class="reto-title"><i data-lucide="swords"></i> <span data-i18n="retos.misiones">Misiones</span></h2>
                <span id="missionsReset" class="reto-pill"></span>
            </div>
            <div id="missionsBody"></div>
        </section>

        <!-- Resumen del mes -->
        <section class="reto-card" id="summary" aria-labelledby="summaryTitle">
            <div class="reto-head">
                <h2 id="summaryTitle" class="reto-title"><i data-lucide="sparkles"></i> <span data-i18n="retos.resumen">Tu mes en Anime Destiny</span></h2>
                <div class="summary-months" role="group" aria-label="Mes">
                    <button type="button" class="reto-chip is-active" data-month="0" data-i18n="retos.este_mes">Este mes</button>
                    <button type="button" class="reto-chip" data-month="-1" data-i18n="retos.mes_pasado">Mes pasado</button>
                </div>
            </div>
            <div id="summaryBody" class="summary-body"></div>
        </section>

        <!-- Avisos push (solo si están configurados en el servidor) -->
        <section class="reto-card reto-card--slim" id="pushCard" hidden>
            <div class="push-row">
                <i data-lucide="bell"></i>
                <p data-i18n="retos.push">¿Querés que te avisemos cuando salga un episodio de lo que estás viendo?</p>
                <button type="button" class="reto-btn" id="pushEnable" data-i18n="retos.push_btn">Activar avisos</button>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="js/core/config.js?v=a5335bc2"></script>
    <script src="js/core/i18n.min.js?v=a5335bc2"></script>
    <script src="js/core/namespace.js?v=a5335bc2"></script>
    <script type="module" src="api/supabase-config.js?v=a5335bc2" async></script>
    <script src="js/core-bundle.min.js?v=a5335bc2" defer></script>
    <script src="js/pages/script.js?v=a5335bc2" defer></script>
    <script src="js/core/push.js?v=a5335bc2" defer></script>
    <script src="js/pages/retos.js?v=a5335bc2" defer></script>
</body>
</html>
