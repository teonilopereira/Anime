<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Destiny — Árbol Diagnóstico</title>
<style>
  :root{--ink:#eaf0ff;--muted:#8a97ba;--gold:#e8cf94;--line:rgba(150,170,210,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070f;
    font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #sky{position:fixed;inset:0;display:block;background:
    radial-gradient(1200px 900px at 50% 50%, #0d1426 0%, #080b16 55%, #04060d 100%)}
  .panel{position:fixed;z-index:5;backdrop-filter:blur(9px);background:rgba(8,12,22,.82);
    border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  #hud{top:14px;left:14px;padding:12px 15px;max-width:min(320px,82vw)}
  #hud h1{margin:0 0 3px;font-family:"Orbitron",sans-serif;font-weight:800;font-size:15px;letter-spacing:.5px;
    background:linear-gradient(90deg,#ff5d5d,var(--gold),#3ddc84);-webkit-background-clip:text;background-clip:text;color:transparent}
  #hud .sub{font-size:12px;color:var(--muted);line-height:1.45}
  /* mode chips top-center */
  #modes{top:14px;left:50%;transform:translateX(-50%);padding:6px;display:flex;gap:4px}
  #modes button{font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
    padding:7px 12px;border-radius:8px;border:1px solid transparent;background:transparent;transition:.14s}
  #modes button:hover{color:var(--ink)}
  #modes button.on{background:rgba(232,207,148,.14);border-color:rgba(232,207,148,.4);color:#fff}
  /* search */
  #searchbox{top:64px;left:50%;transform:translateX(-50%);padding:6px 8px;display:flex;align-items:center;gap:8px}
  #q{background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:13px;padding:4px 6px;width:230px;outline:none}
  #q::placeholder{color:var(--muted)}
  #qn{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:4px}
  /* info */
  #info{top:14px;right:14px;width:270px;padding:0;display:none;overflow:hidden;max-height:calc(100vh - 120px);overflow-y:auto}
  #info .h{padding:12px 15px 10px;border-bottom:1px solid var(--line)}
  #info .k{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  #info .n{font-size:15px;font-weight:700;word-break:break-all;margin-top:3px}
  #info .d{padding:10px 15px 4px;font-size:12px;color:var(--muted);line-height:1.45}
  #info .rows{padding:8px 15px 14px}
  #info .r{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid rgba(150,170,210,.08)}
  #info .r span{color:var(--muted)} #info .r b{color:var(--ink);font-variant-numeric:tabular-nums}
  #info .risk{margin:6px 0 2px} #info .bar{height:7px;border-radius:5px;background:rgba(150,170,210,.14);overflow:hidden;margin-top:5px}
  #info .bar i{display:block;height:100%;border-radius:5px}
  #tip{position:fixed;z-index:6;pointer-events:none;opacity:0;transition:opacity .1s;padding:6px 11px;
    font-size:12px;border-radius:8px;background:rgba(4,8,16,.96);border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:250px}
  #tip b{color:var(--gold)}
  /* legend */
  #leg{bottom:14px;left:14px;padding:10px 13px;font-size:11px;color:var(--muted);max-width:280px}
  #leg .scale{height:9px;border-radius:5px;margin:5px 0 4px;
    background:linear-gradient(90deg,#3ddc84,#ffe14d,#ff9a3d,#ff4d5d)}
  #leg .ends{display:flex;justify-content:space-between} #leg .note{margin-top:6px;opacity:.8;line-height:1.4}
  #leg b{color:var(--ink)}
  .btn{position:fixed;z-index:5;bottom:14px;right:14px;display:flex;gap:8px}
  .btn button{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
    padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(10,15,26,.85);transition:.14s}
  .btn button:hover{border-color:var(--gold)}
  @media(max-width:720px){
    #info,#leg{display:none!important}
    #hud{left:8px;right:8px;top:8px;max-width:none;padding:8px 11px}#hud .sub{display:none}
    #modes{top:50px;left:8px;right:8px;transform:none;justify-content:flex-start;
      overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
    #modes button{flex:0 0 auto}
    #searchbox{top:100px;left:8px;right:8px;transform:none}
    #q{flex:1;width:auto;min-width:0}
    .btn{bottom:10px;right:10px}.btn button{padding:9px 12px}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="panel" id="hud">
  <h1>🩺 ANIME DESTINY · DIAGNÓSTICO</h1>
  <div class="sub">Mapa de calor de riesgo del código. El color y el tamaño de cada
    hexágono marcan dónde mirar primero. Buscá una función o abrí un área.</div>
</div>

<div class="panel" id="modes">
  <button data-m="riesgo" class="on">Riesgo</button>
  <button data-m="size">Tamaño</button>
  <button data-m="fragil">Fragilidad</button>
  <button data-m="churn">Churn</button>
  <button data-m="tests">Tests</button>
</div>

<div class="panel" id="searchbox">
  🔍 <input id="q" placeholder="buscar función o archivo… (renderDetalle, seasons)" autocomplete="off">
  <span id="qn"></span>
</div>

<div class="panel" id="info">
  <div class="h"><div class="k" id="iK"></div><div class="n" id="iN"></div></div>
  <div class="d" id="iD"></div>
  <div class="rows" id="iR"></div>
</div>

<div id="tip"></div>
<div class="panel" id="leg">
  <div><b id="legTitle">Riesgo</b> — bajo → alto</div>
  <div class="scale" id="legScale"></div>
  <div class="ends"><span id="legLo">seguro</span><span id="legHi">revisar primero</span></div>
  <div class="note" id="legNote"></div>
</div>
<div class="btn">
  <button id="expand">✦ Expandir todo</button>
  <button id="collapse">↺ Plegar</button>
</div>

  if(n.expanded)for(const c of n.children){c.x=n.x;c.y=n.y;}layout();}
const tip=document.getElementById('tip');
let drag=false,moved=false,last={x:0,y:0};
cv.addEventListener('mousemove',e=>{
  if(drag){pan.x+=(e.clientX-last.x)*DPR;pan.y+=(e.clientY-last.y)*DPR;last={x:e.clientX,y:e.clientY};moved=true;return;}
  const n=pick(e.clientX,e.clientY);hover=n;cv.style.cursor=n?'pointer':'grab';
  if(n){tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-240)+'px';tip.style.top=(e.clientY+16)+'px';
    const extra=n.kind==='file'&&n.m?` · ${n.m.lines} líneas · ${n.m.tested?'con test':'SIN TEST'}`:(n.children.length?' · '+n.children.length+' dentro':'');
    tip.innerHTML=`<b>${n.path||n.label}</b>${extra}`;}else tip.style.opacity=0;});
cv.addEventListener('mousedown',e=>{drag=true;moved=false;last={x:e.clientX,y:e.clientY};cv.style.cursor='grabbing';});
addEventListener('mouseup',e=>{if(drag&&!moved){const n=pick(e.clientX,e.clientY);
  if(n){sel=n;showInfo(n);toggle(n);}else{sel=null;showInfo(null);}}drag=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;
  const wx=(e.clientX*DPR-W/2-pan.x)/scale,wy=(e.clientY*DPR-H/2-pan.y)/scale;scale=Math.max(.35,Math.min(3.5,scale*f));
  pan.x=e.clientX*DPR-W/2-wx*scale;pan.y=e.clientY*DPR-H/2-wy*scale;},{passive:false});
let tl=null;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tl={x:t.clientX,y:t.clientY};moved=false;hover=pick(t.clientX,t.clientY);},{passive:true});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];if(tl){pan.x+=(t.clientX-tl.x)*DPR;pan.y+=(t.clientY-tl.y)*DPR;tl={x:t.clientX,y:t.clientY};moved=true;}},{passive:true});
cv.addEventListener('touchend',()=>{if(tl&&!moved&&hover){sel=hover;showInfo(hover);toggle(hover);}tl=null;});

/* modes */
const legNote={riesgo:'Combina tamaño + fragilidad + churn + falta de tests. Empezá por los rojos.',
  size:'Líneas de código. Archivos grandes = más lugar para un bug.',
  fragil:'catch + console.error + llamadas a API externas. Zona de fallos de red/datos.',
  churn:'Cantidad de commits que tocaron el archivo. Ojo: los HTML salen altos por el sello de versión del build.',
  tests:'Rojo = SIN test · Verde = con test. Tocar un rojo es más arriesgado.'};
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  mode=b.dataset.m;setValues();
  document.getElementById('legTitle').textContent=b.textContent;
  document.getElementById('legNote').textContent=legNote[mode];
  document.getElementById('legScale').style.background = mode==='tests'
    ? 'linear-gradient(90deg,#3ddc84,#ff4d5d)' : 'linear-gradient(90deg,#3ddc84,#ffe14d,#ff9a3d,#ff4d5d)';
  document.getElementById('legLo').textContent = mode==='tests'?'con test':'seguro';
  document.getElementById('legHi').textContent = mode==='tests'?'sin test':'revisar primero';
  if(sel)showInfo(sel);
});
document.getElementById('legNote').textContent=legNote.riesgo;

document.getElementById('expand').onclick=()=>{(function go(n){if(n.children.length){n.expanded=true;
  for(const c of n.children){if(c.x===null){c.x=n.x;c.y=n.y;}}n.children.forEach(go);}})(root);layout();fitTree();};
function foldersView(){root.children.forEach(function c(n){n.expanded=false;n.children.forEach(c);});
  root.expanded=true;root.children.forEach(f=>{f.expanded=true;for(const c of f.children){if(c.x===null){c.x=0;c.y=0;}}});
  layout();fitTree();}
document.getElementById('collapse').onclick=()=>{sel=null;showInfo(null);
  document.getElementById('q').value='';hits=new Set();hitFiles=new Set();document.getElementById('qn').textContent='';
  foldersView();};

foldersView();draw();
</script>
</body>
</html>
