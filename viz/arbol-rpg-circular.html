<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Destiny — Árbol RPG Circular</title>
<style>
  :root{--ink:#eaf0ff;--muted:#8a97ba;--gold:#e8cf94;--line:rgba(150,170,210,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070f;
    font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #sky{position:fixed;inset:0;display:block;background:
    radial-gradient(1200px 900px at 50% 50%, #0d1426 0%, #080b16 55%, #04060d 100%)}
  .panel{position:fixed;z-index:5;backdrop-filter:blur(9px);background:rgba(8,12,22,.8);
    border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  #hud{top:16px;left:16px;padding:14px 17px;max-width:min(330px,84vw)}
  #hud h1{margin:0 0 3px;font-family:"Orbitron",sans-serif;font-weight:800;font-size:16px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--gold),#fff,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #hud .sub{font-size:12.5px;color:var(--muted);line-height:1.5}
  #hud .sub b{color:#a98bff}
  #info{top:16px;right:16px;width:262px;padding:0;display:none;overflow:hidden}
  #info .h{padding:12px 15px 10px;border-bottom:1px solid var(--line)}
  #info .k{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  #info .n{font-size:15.5px;font-weight:700;word-break:break-all;margin-top:3px}
  #info .d{padding:11px 15px;font-size:12.5px;color:var(--muted);line-height:1.5}
  #info .meta{padding:0 15px 13px;font-size:11.5px;color:var(--muted)}
  #info .meta b{color:var(--ink)}
  #tip{position:fixed;z-index:6;pointer-events:none;opacity:0;transition:opacity .1s;padding:6px 11px;
    font-size:12.5px;border-radius:8px;background:rgba(4,8,16,.96);border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:240px}
  #tip b{color:var(--gold)}
  #foot{position:fixed;z-index:5;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  #foot .n{font-family:"Orbitron",sans-serif;font-size:14px;color:var(--gold);letter-spacing:1px}
  #foot .n b{color:#fff}
  #foot .l{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .btn{position:fixed;z-index:5;bottom:16px;right:16px;display:flex;gap:8px}
  .btn button{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
    padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(10,15,26,.85);transition:.14s}
  .btn button:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(232,207,148,.25)}
  #hint{bottom:14px;left:16px;padding:7px 13px;font-size:11.5px;color:var(--muted)}
  #hint b{color:var(--gold)}
  @media(max-width:640px){#info{display:none!important}#hud .sub{display:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="panel" id="hud">
  <h1>⬡ ANIME DESTINY · SKILL TREE</h1>
  <div class="sub">Árbol circular: el proyecto en el centro y todo abriéndose por los
    costados. Cada hexágono se despliega en <b>lo que contiene</b> (carpeta → archivos → funciones).</div>
</div>

<div class="panel" id="info">
  <div class="h"><div class="k" id="iK"></div><div class="n" id="iN"></div></div>
  <div class="d" id="iD"></div>
  <div class="meta" id="iM"></div>
</div>

<div id="tip"></div>
<div id="foot"><div class="n"><b id="fN">0</b> / <span id="fT">0</span> nodos revelados</div>
  <div class="l">explorá el árbol</div></div>
<div class="panel" id="hint"><b>click</b> hexágono = abrir/cerrar · arrastrar = mover · rueda = zoom</div>
<div class="btn">
  <button id="expand">✦ Expandir todo</button>
  <button id="collapse">↺ Plegar</button>
</div>

/* ===== construir árbol ===== */
let uid=0;
function node(o){return Object.assign({id:uid++,children:[],expanded:false,x:null,y:null,tx:0,ty:0,tang:0,trad:0,r:0},o);}
const root=node({label:'ANIME DESTINY',kind:'root',group:'root',desc:'PWA de catálogo de anime, manga, novelas y juegos.',depth:0,expanded:true});
for(const g of ORDER){
  const fol=node({label:FOLDERS[g].label,kind:'folder',group:g,desc:FOLDERS[g].desc,depth:1,parent:root});
  root.children.push(fol);
  for(const path of FILESBY[g]){
    const file=node({label:path.split('/').pop(),path,kind:'file',group:g,desc:DESC[path]||'',depth:2,parent:fol});
    fol.children.push(file);
    const inner = g==='html' ? (HTMLIN[path]||[]) : (INNER[path]||[]);
    for(const it of inner){
      file.children.push(node({label:it,kind:g==='html'?'script':'member',group:g,
        desc:g==='html'?('Script cargado por '+path):((it.startsWith('window.')?'API global expuesta':'Función definida')+' en '+path),
        depth:3,parent:file}));
    }
  }
}
let TOTAL=0;(function count(n){TOTAL++;n.children.forEach(count);})(root);

/* ===== engine ===== */
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
let W,H,DPR,RING;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';RING=Math.min(W,H)*0.145;setRadii();layout();}
function radiusOf(n){return n.kind==='root'?22*DPR:n.kind==='folder'?15*DPR:n.kind==='file'?10.5*DPR:6*DPR;}
function setRadii(){(function setR(n){n.r=radiusOf(n);n.children.forEach(setR);})(root);}

let scale=1,pan={x:0,y:0},leafCount=1;
function layout(){let idx=0;leafCount=0;
  (function cnt(n){if(n.expanded&&n.children.length)n.children.forEach(cnt);else leafCount++;})(root);
  (function assign(n){
    if(n.expanded&&n.children.length){n.children.forEach(assign);
      n.tang=(n.children[0].tang+n.children[n.children.length-1].tang)/2;}
    else{n.tang=(idx+0.5)/leafCount*Math.PI*2-Math.PI/2;idx++;}
    n.trad=n.depth*RING;n.tx=Math.cos(n.tang)*n.trad;n.ty=Math.sin(n.tang)*n.trad;
  })(root);
  root.tx=0;root.ty=0;root.trad=0;
}
resize();addEventListener('resize',resize);

function visible(){const out=[];(function go(n){out.push(n);if(n.expanded)n.children.forEach(go);})(root);return out;}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function colorOf(n){return n.group==='root'?'#e8cf94':FOLDERS[n.group].c;}
function hexPath(x,y,r,rot){ctx.beginPath();for(let k=0;k<6;k++){const a=rot+k*Math.PI/3;
  const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}

/* ===== render ===== */
let hover=null,sel=null,time=0;
function draw(){time+=0.016;
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+pan.x,H/2+pan.y);ctx.scale(scale,scale);
  // faint rings
  ctx.strokeStyle='rgba(150,170,210,.05)';ctx.lineWidth=1*DPR;
  for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(0,0,k*RING,0,7);ctx.stroke();}

  const vis=visible();
  for(const n of vis){if(n.x===null){n.x=(n.parent?n.parent.x:0)||0;n.y=(n.parent?n.parent.y:0)||0;}
    n.x+=(n.tx-n.x)*0.22;n.y+=(n.ty-n.y)*0.22;}
  const anc=new Set();if(hover){let p=hover;while(p){anc.add(p);p=p.parent;}}
  const showLeafLabels=leafCount<70||scale>1.35;

  // links: leave parent along parent angle, bend to child
  for(const n of vis){if(!n.expanded)continue;
    for(const c of n.children){
      const on=!hover||(anc.has(c))||c===hover||n===hover;
      const col=colorOf(c),midR=(n.trad+c.trad)/2;
      const cpx=Math.cos(n.tang)*midR,cpy=Math.sin(n.tang)*midR;
      ctx.strokeStyle=hexA(col,on?.55:.12);ctx.lineWidth=(c.depth<=1?2.4:c.depth===2?1.5:0.9)*DPR;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.quadraticCurveTo(cpx,cpy,c.x,c.y);ctx.stroke();
    }}
  // nodes
  for(const n of vis){
    const col=colorOf(n),on=!hover||anc.has(n)||(n.parent===hover),isSel=n===sel,isH=n===hover;
    const pulse=isSel?1+Math.sin(time*3)*0.05:1;
    const r=n.r*(isH?1.3:1)*pulse, rot=n.tang+Math.PI/6;
    const opened=n.expanded&&n.children.length;
    if(isH||isSel||n.kind==='root'){ctx.globalCompositeOperation='lighter';
      const gl=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3);
      gl.addColorStop(0,hexA(col,isH?.5:.34));gl.addColorStop(1,hexA(col,0));
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(n.x,n.y,r*3,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';}
    // hex body
    if(opened||n.kind==='root'){const bd=ctx.createRadialGradient(n.x-r*.3,n.y-r*.3,r*.1,n.x,n.y,r);
      bd.addColorStop(0,'#ffffff');bd.addColorStop(1,hexA(col,.85));ctx.fillStyle=bd;}
    else ctx.fillStyle=on?'rgba(16,22,38,.95)':'rgba(14,18,30,.5)';
    hexPath(n.x,n.y,r,rot);ctx.fill();
    ctx.strokeStyle=opened?hexA('#ffffff',.9):hexA(col,on?.85:.3);
    ctx.lineWidth=(n.kind==='root'?2.6:n.kind==='folder'?2:1.4)*DPR;
    hexPath(n.x,n.y,r,rot);ctx.stroke();
    // inner hex accent
    if(r>7*DPR){ctx.strokeStyle=opened?hexA(col,.5):hexA(col,on?.5:.2);ctx.lineWidth=1*DPR;
      hexPath(n.x,n.y,r*0.55,rot);ctx.stroke();}
    // "+" badge for collapsed with children
    if(!n.expanded&&n.children.length){ctx.fillStyle=opened?hexA('#0a1020',.9):hexA(col,on?.95:.4);
      ctx.font=`${Math.max(8,r*1.1)}px "Orbitron",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('+',n.x,n.y+0.5);}
    // label (radial)
    const wantLabel = n.kind==='root'||n.depth<3||n===hover||n.parent===hover||showLeafLabels;
    if(on&&wantLabel){
      if(n.kind==='root'){ctx.textAlign='center';ctx.textBaseline='top';
        ctx.font=`${13*DPR}px "Orbitron",sans-serif`;ctx.fillStyle='#fff';ctx.fillText(n.label,n.x,n.y+r+4*DPR);}
      else{ctx.save();ctx.translate(n.x,n.y);const flip=Math.cos(n.tang)<0;
        ctx.rotate(flip?n.tang+Math.PI:n.tang);ctx.textAlign=flip?'right':'left';ctx.textBaseline='middle';
        ctx.font=`${(isH?12.5:n.depth<2?12.5:10.5)*DPR}px "Rajdhani",sans-serif`;
        const off=(r+5*DPR)*(flip?-1:1);
        ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(n.label,off+ (flip?-DPR:DPR),DPR);
        ctx.fillStyle=isH?'#fff':hexA(col,n.depth<3?.95:.72);ctx.fillText(n.label,off,0);ctx.restore();}
    }
  }
  ctx.restore();
  requestAnimationFrame(draw);
}

/* ===== info panel ===== */
function showInfo(n){const info=document.getElementById('info');
  if(!n){info.style.display='none';return;}
  info.style.display='block';
  const kind=n.kind==='root'?'PROYECTO':n.kind==='folder'?'CARPETA':n.kind==='file'?'ARCHIVO':n.kind==='script'?'SCRIPT':'FUNCIÓN / API';
  document.getElementById('iK').textContent=kind;document.getElementById('iK').style.color=colorOf(n);
  document.getElementById('iN').textContent=n.path||n.label;
  document.getElementById('iD').textContent=n.desc||'';
  const inner=n.children.length;
  document.getElementById('iM').innerHTML=inner?`Contiene <b>${inner}</b> ${n.kind==='folder'?'archivos':n.kind==='file'?'funciones / APIs':'elementos'} · <b>${n.expanded?'abierto':'cerrado'}</b>`:'Nodo hoja (sin contenido interno)';
}

/* ===== interaction ===== */
function toW(cx,cy){return{x:(cx*DPR-W/2-pan.x)/scale,y:(cy*DPR-H/2-pan.y)/scale};}
function pick(cx,cy){const p=toW(cx,cy);let best=null,bd=1e9;
  for(const n of visible()){const d=Math.hypot(n.x-p.x,n.y-p.y);
    if(d<Math.max(n.r*1.5,12*DPR)&&d<bd){bd=d;best=n;}}return best;}
function toggle(n){if(!n.children.length)return;n.expanded=!n.expanded;
  if(n.expanded)for(const c of n.children){c.x=n.x;c.y=n.y;}layout();updateFoot();}
function updateFoot(){document.getElementById('fN').textContent=visible().length;
  document.getElementById('fT').textContent=TOTAL;}
const tip=document.getElementById('tip');
let drag=false,moved=false,last={x:0,y:0};
cv.addEventListener('mousemove',e=>{
  if(drag){pan.x+=(e.clientX-last.x)*DPR;pan.y+=(e.clientY-last.y)*DPR;last={x:e.clientX,y:e.clientY};moved=true;return;}
  const n=pick(e.clientX,e.clientY);hover=n;cv.style.cursor=n?'pointer':'grab';
  if(n){tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-230)+'px';tip.style.top=(e.clientY+16)+'px';
    tip.innerHTML=`<b>${n.path||n.label}</b>${n.children.length?' · '+n.children.length+' dentro':''}`;}
  else tip.style.opacity=0;});
cv.addEventListener('mousedown',e=>{drag=true;moved=false;last={x:e.clientX,y:e.clientY};cv.style.cursor='grabbing';});
addEventListener('mouseup',e=>{if(drag&&!moved){const n=pick(e.clientX,e.clientY);
  if(n){sel=n;showInfo(n);toggle(n);}else{sel=null;showInfo(null);}}drag=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;
  const wx=(e.clientX*DPR-W/2-pan.x)/scale,wy=(e.clientY*DPR-H/2-pan.y)/scale;scale=Math.max(.35,Math.min(3.5,scale*f));
  pan.x=e.clientX*DPR-W/2-wx*scale;pan.y=e.clientY*DPR-H/2-wy*scale;},{passive:false});
let tl=null;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tl={x:t.clientX,y:t.clientY};moved=false;
  hover=pick(t.clientX,t.clientY);},{passive:true});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];if(tl){pan.x+=(t.clientX-tl.x)*DPR;pan.y+=(t.clientY-tl.y)*DPR;
  tl={x:t.clientX,y:t.clientY};moved=true;}},{passive:true});
cv.addEventListener('touchend',()=>{if(tl&&!moved&&hover){sel=hover;showInfo(hover);toggle(hover);}tl=null;});

document.getElementById('expand').onclick=()=>{(function go(n){if(n.children.length){n.expanded=true;
  for(const c of n.children){if(c.x===null){c.x=n.x;c.y=n.y;}}n.children.forEach(go);}})(root);layout();updateFoot();};
document.getElementById('collapse').onclick=()=>{root.children.forEach(function c(n){n.expanded=false;n.children.forEach(c);});
  root.expanded=true;layout();sel=null;showInfo(null);updateFoot();scale=1;pan.x=0;pan.y=0;};

updateFoot();draw();
</script>
