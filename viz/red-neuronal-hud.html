<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Destiny — Consola Neuronal (HUD)</title>
<style>
  :root{ --ink:#d7f2ff; --muted:#6f95ad; --line:rgba(90,180,220,.22); --acc:#3ad0ff; --acc2:#9b7bff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#040a10;
    font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #net{position:fixed;inset:0;display:block;background:
    radial-gradient(1200px 900px at 50% 40%, #08151f 0%, #050b12 55%, #03070c 100%)}
  .mono{font-family:"JetBrains Mono",ui-monospace,"Consolas",monospace}
  .panel{position:fixed;z-index:5;backdrop-filter:blur(10px);
    background:rgba(6,16,24,.82);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 40px rgba(0,0,0,.55),inset 0 0 24px rgba(40,160,220,.05)}
  /* header */
  #top{top:14px;left:14px;right:14px;display:flex;align-items:center;gap:16px;
    padding:10px 16px;justify-content:space-between}
  #top .brand{font-family:"Orbitron",sans-serif;font-weight:800;font-size:15px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  #top .metrics{display:flex;gap:18px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  #top .metrics b{color:var(--ink);font-size:15px;font-family:"Orbitron",sans-serif;margin-right:5px}
  #search{background:rgba(3,10,16,.9);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:inherit;font-size:13px;padding:7px 11px;width:190px;outline:none}
  #search:focus{border-color:var(--acc);box-shadow:0 0 12px rgba(58,208,255,.25)}
  /* legend rail */
  #rail{left:14px;top:70px;padding:12px 12px;width:172px}
  #rail h4{margin:0 0 8px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .legend span{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;
    padding:3px 5px;border-radius:6px;font-size:12px;transition:.12s}
  .legend span:hover{background:rgba(255,255,255,.05);color:var(--ink)}
  .legend i{width:10px;height:10px;transform:rotate(45deg);flex:none;box-shadow:0 0 8px currentColor}
  .legend b{margin-left:auto;font-size:10.5px;opacity:.7}
  .legend span.off{opacity:.3;text-decoration:line-through}
  /* inspector */
  #insp{right:14px;top:70px;width:280px;max-height:calc(100vh - 150px);overflow:auto;padding:0;display:none}
  #insp .ih{padding:13px 15px 11px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:rgba(6,16,24,.96);backdrop-filter:blur(6px)}
  #insp .ih .k{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  #insp .ih .fn{font-size:15px;font-weight:700;word-break:break-all;margin-top:2px}
  #insp .ih .fd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
  #insp .chip{display:inline-block;margin-top:8px;font-size:10.5px;padding:3px 9px;border-radius:20px}
  #insp .sec{padding:11px 15px}
  #insp .sec h5{margin:0 0 7px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between}
  #insp .row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer}
  #insp .row:hover{background:rgba(58,208,255,.1)}
  #insp .row i{width:7px;height:7px;transform:rotate(45deg);flex:none;box-shadow:0 0 6px currentColor}
  #insp .empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:2px 6px}
  #insp .x{position:absolute;top:11px;right:12px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
  #insp .x:hover{color:var(--ink)}
  /* tooltip */
  #tip{position:fixed;z-index:6;pointer-events:none;opacity:0;transition:opacity .1s;
    padding:6px 11px;font-size:12.5px;border-radius:8px;background:rgba(3,12,18,.96);
    border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.6)}
  #tip b{color:var(--acc)}
  /* footer hint + buttons */
  #hint{bottom:12px;left:14px;padding:7px 13px;font-size:11.5px;color:var(--muted)}
  #hint b{color:var(--acc)}
  .btn{position:fixed;z-index:5;bottom:12px;right:14px;display:flex;gap:8px}
  .btn button{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
    padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(8,20,28,.85);transition:.12s}
  .btn button:hover{border-color:var(--acc);box-shadow:0 0 14px rgba(58,208,255,.28)}
  @media(max-width:720px){#rail,#insp{display:none!important}#top .metrics{display:none}}
</style>
</head>
<body>
<canvas id="net"></canvas>

<div class="panel" id="top">
  <div class="brand">⬡ ANIME DESTINY · NEURAL CONSOLE</div>
  <div class="metrics mono">
    <span><b id="nCount">0</b>NODOS</span>
    <span><b id="eCount">0</b>ENLACES</span>
    <span><b id="fps">0</b>FPS</span>
    <span id="selInfo">— sin selección —</span>
  </div>
  <input id="search" placeholder="buscar archivo…" autocomplete="off">
</div>

<div class="panel" id="rail">
  <h4>Clústeres</h4>
  <div class="legend" id="legend"></div>
</div>

<div class="panel" id="insp">
  <div class="ih"><span class="x" id="ix">✕</span>
    <div class="k">Neurona</div><div class="fn" id="iName"></div>
    <div class="fd" id="iDesc"></div><span class="chip" id="iChip"></span></div>
  <div class="sec"><h5>Activa / carga <span id="iOutN" class="mono"></span></h5><div id="iOut"></div></div>
  <div class="sec" style="border-top:1px solid var(--line)"><h5>Es cargada por <span id="iInN" class="mono"></span></h5><div id="iIn"></div></div>
</div>

<div id="tip"></div>
<div class="panel" id="hint"><b>click</b> en una neurona para inspeccionarla · <b>doble click</b> dispara impulso · arrastrá · rueda = zoom</div>
<div class="btn">
  <button id="fire">⚡ Pulso global</button>
  <button id="reset">↺ Reset</button>
</div>

<script>
/* ===== MODELO: neuronas = archivos reales; enlaces = <script> por HTML + bundle ===== */
const GROUPS = {
  html:    {name:'Páginas HTML',   color:'#3ad0ff'},
  bundle:  {name:'Bundle núcleo',  color:'#e8f6ff'},
  core:    {name:'js/core',        color:'#9b7bff'},
  catalog: {name:'js/catalog',     color:'#ff6ec7'},
  detalle: {name:'js/detalle',     color:'#ff9e45'},
  pages:   {name:'js/pages',       color:'#57e08a'},
  security:{name:'js/security',    color:'#ff5d6c'},
  ui:      {name:'js/ui',          color:'#ffd24d'},
  api:     {name:'api/',           color:'#5c8cff'},
  data:    {name:'datos / utils',  color:'#3dffd8'},
};
const N = [
  ['index.html','html','Portada / menú principal'],['anime.html','html','Catálogo de anime'],
  ['manga.html','html','Catálogo de manga'],['novelas.html','html','Novelas ligeras'],
  ['detalle.html','html','Ficha de detalle'],['mis-listas.html','html','Listas del usuario'],
  ['usuario.html','html','Perfil de usuario'],['configuracion.html','html','Ajustes'],
  ['comparar.html','html','Comparar dos títulos'],['ranking.html','html','Ranking de títulos'],
  ['top.html','html','Top de juegos'],['Login.html','html','Inicio de sesión'],
  ['privacidad.html','html','Privacidad'],['terminos.html','html','Términos'],['404.html','html','Error 404'],
  ['core-bundle.min.js','bundle','Bundle: 15 módulos concatenados por tools/build.js'],
  ['core/config.js','core','Configuración runtime'],['core/i18n.js','core','Internacionalización'],
  ['core/namespace.js','core','window.AnimeDestiny + registro PWA'],['core/constants.js','core','Constantes globales'],
  ['core/common-ui.js','core','Navbar/footer inyectados'],['core/user-store.js','core','Estado del usuario'],
  ['core/auth.js','core','Autenticación'],['core/api.js','core','Cliente AniList (GraphQL)'],
  ['core/mangadex-api.js','core','Cliente MangaDex'],['core/storage.js','core','localStorage wrapper'],
  ['catalog/states.js','catalog','Estados de tarjetas'],['catalog/cards.js','catalog','Render de tarjetas'],
  ['catalog/search.js','catalog','Buscador'],['catalog/pagination.js','catalog','Paginación'],
  ['detalle/data.js','detalle','Datos de la ficha'],['detalle/progress.js','detalle','Progreso de episodios'],
  ['detalle/seasons.js','detalle','Cadena de temporadas'],['detalle/themes.js','detalle','Temas/openings'],
  ['detalle/render.js','detalle','Render de la ficha'],['detalle/interactions.js','detalle','Likes / interacciones'],
  ['detalle/comments.js','detalle','Comentarios'],['pages/script.js','pages','Controlador de catálogo'],
  ['pages/mis-listas.js','pages','Controlador de listas'],['pages/usuario.js','pages','Controlador de perfil'],
  ['pages/import-mal.js','pages','Importar desde MAL'],['pages/configuracion.js','pages','Controlador de ajustes'],
  ['pages/comparar.js','pages','Controlador de comparación'],['pages/ranking.js','pages','Ranking de juegos'],
  ['pages/ranking-top.js','pages','Ranking de títulos'],['pages/login.js','pages','Controlador de login'],
  ['security/sanitizer.js','security','Sanitización HTML'],['security/validator.js','security','Validación de datos'],
  ['ui/toast.js','ui','Notificaciones toast'],['api/supabase-config.js','api','Cliente Supabase (ESM)'],
  ['datos.js','data','Datos de respaldo'],['utils.js','data','Utilidades varias'],
];
const rawPages = {
  '404.html':['core/config.js','core/i18n.js','core/constants.js','core/namespace.js','datos.js','api/supabase-config.js','core/common-ui.js'],
  'Login.html':['core/config.js','core/i18n.js','core/constants.js','core/namespace.js','datos.js','api/supabase-config.js','core/user-store.js','core/auth.js','pages/login.js','core/common-ui.js'],
  'anime.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','pages/script.js'],
  'comparar.html':['core/config.js','core/namespace.js','core/i18n.js','api/supabase-config.js','core-bundle.min.js','core/mangadex-api.js','pages/script.js','pages/comparar.js'],
  'configuracion.html':['core/config.js','core/i18n.js','core/constants.js','core/namespace.js','api/supabase-config.js','core/user-store.js','core/auth.js','pages/configuracion.js','core/common-ui.js'],
  'detalle.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','core/mangadex-api.js','detalle/data.js','detalle/progress.js','detalle/seasons.js','detalle/themes.js','detalle/render.js','detalle/interactions.js','detalle/comments.js'],
  'index.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','pages/script.js'],
  'manga.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','core/mangadex-api.js','pages/script.js'],
  'mis-listas.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','pages/mis-listas.js'],
  'novelas.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','core/mangadex-api.js','pages/script.js'],
  'privacidad.html':['core/config.js','core/i18n.js','core/constants.js','core/namespace.js','datos.js','api/supabase-config.js','core/common-ui.js'],
  'ranking.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','pages/ranking-top.js'],
  'terminos.html':['core/config.js','core/i18n.js','core/constants.js','core/namespace.js','datos.js','api/supabase-config.js','core/common-ui.js'],
  'top.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','pages/ranking.js'],
  'usuario.html':['core/config.js','core/i18n.js','core/namespace.js','api/supabase-config.js','core-bundle.min.js','pages/usuario.js','pages/import-mal.js'],
};
const bundleParts = ['core/constants.js','core/api.js','datos.js','core/user-store.js','core/storage.js','core/auth.js','security/sanitizer.js','security/validator.js','utils.js','ui/toast.js','catalog/states.js','catalog/cards.js','catalog/search.js','catalog/pagination.js','core/common-ui.js'];
const E=[];
for(const[pg,deps]of Object.entries(rawPages))for(const d of deps)E.push([pg,d]);
for(const p of bundleParts)E.push(['core-bundle.min.js',p]);

/* ===== engine ===== */
const cv=document.getElementById('net'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
resize();addEventListener('resize',resize);

const nodes=N.map(([id,g,desc],i)=>({id,g,desc,label:id.split('/').pop(),path:id,inN:0,outN:0,deg:0,
  x:W/2+(Math.random()-.5)*W*.5,y:H/2+(Math.random()-.5)*H*.5,vx:0,vy:0,spin:Math.random()*6.28,flash:0}));
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const edges=E.map(([a,b],i)=>{const s=byId[a],t=byId[b];if(s&&t){s.outN++;t.inN++;s.deg++;t.deg++;}
  return{s:byId[a],t:byId[b],curve:(((i*2654435761)%1000)/1000-.5)*0.5};}).filter(e=>e.s&&e.t);
nodes.forEach(n=>n.r=(6+Math.sqrt(n.deg)*2.7)*DPR);

// group counts for legend
const gCount={};nodes.forEach(n=>gCount[n.g]=(gCount[n.g]||0)+1);

let scale=1,ox=0,oy=0;
document.getElementById('nCount').textContent=nodes.length;
document.getElementById('eCount').textContent=edges.length;

const hidden=new Set();
const leg=document.getElementById('legend');
for(const[k,v]of Object.entries(GROUPS)){
  const s=document.createElement('span');
  s.innerHTML=`<i style="color:${v.color};background:${v.color}"></i>${v.name}<b>${gCount[k]||0}</b>`;
  s.onclick=()=>{hidden.has(k)?hidden.delete(k):hidden.add(k);s.classList.toggle('off');};
  leg.appendChild(s);
}
const gk=Object.keys(GROUPS);
const gcen={};gk.forEach((g,i)=>{const a=i/gk.length*Math.PI*2;
  gcen[g]={x:W/2+Math.cos(a)*Math.min(W,H)*.30,y:H/2+Math.sin(a)*Math.min(W,H)*.30};});

let time=0;
function tick(){time+=0.016;
  for(let i=0;i<nodes.length;i++){const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1;
      if(d2<160000*DPR*DPR){const d=Math.sqrt(d2),f=(2900*DPR*DPR)/d2;
        const fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}}
  for(const e of edges){const a=e.s,b=e.t;let dx=b.x-a.x,dy=b.y-a.y,
    d=Math.hypot(dx,dy)||1,rest=(100+a.r+b.r)*DPR*.5,f=(d-rest)*0.008;
    const fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
  for(const n of nodes){const c=gcen[n.g];
    n.vx+=(c.x-n.x)*0.0016;n.vy+=(c.y-n.y)*0.0016;
    n.vx+=(W/2-n.x)*0.0005;n.vy+=(H/2-n.y)*0.0005;
    n.spin+=0.004; if(n.flash)n.flash*=0.92;
    if(n===drag){n.vx=n.vy=0;continue;}
    n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;}
}

const pulses=[];
function fire(node){for(const e of edges){if(e.s===node||e.t===node){pulses.push({e,p:0,fwd:e.s===node});}}if(node)node.flash=1;}
function fireGlobal(){for(const n of nodes)if(n.g==='html'&&Math.random()<.85)setTimeout(()=>fire(n),Math.random()*450);}
setInterval(()=>{const n=nodes[Math.random()*nodes.length|0];if(n)fire(n);},460);

let hover=null,drag=null,sel=null,mx=0,my=0,query='';
const tip=document.getElementById('tip');
function ctrl(e){const a=e.s,b=e.t,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;
  return{cx:mx-dy*e.curve,cy:my+dx*e.curve};}
function bez(a,c,b,t){const u=1-t;return{x:u*u*a.x+2*u*t*c.cx+t*t*b.x,y:u*u*a.y+2*u*t*c.cy+t*t*b.y};}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function match(n){return query&&n.path.toLowerCase().includes(query);}

// hex path
function hexPath(x,y,r,rot){ctx.beginPath();for(let k=0;k<6;k++){const a=rot+k*Math.PI/3;
  const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}

// blueprint grid (screen space)
function grid(){const step=42*DPR, off=DPR;
  ctx.strokeStyle='rgba(80,170,210,.05)';ctx.lineWidth=1*off;
  ctx.beginPath();for(let x=0;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=0;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();}

let fps=0,fAcc=0,fLast=performance.now();
function draw(){
  const now=performance.now();fAcc++;if(now-fLast>500){fps=Math.round(fAcc*1000/(now-fLast));fAcc=0;fLast=now;
    document.getElementById('fps').textContent=fps;}
  tick();
  ctx.clearRect(0,0,W,H);grid();
  ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
  const foc=sel||hover;
  const neigh=new Set();
  if(foc){neigh.add(foc);for(const e of edges){if(e.s===foc)neigh.add(e.t);if(e.t===foc)neigh.add(e.s);}}

  // edges (directed, curved, with arrow-ish taper via gradient)
  for(const e of edges){
    if(hidden.has(e.s.g)||hidden.has(e.t.g))continue;
    const on=!foc||(neigh.has(e.s)&&neigh.has(e.t));
    const C=ctrl(e), c=GROUPS[e.t.g].color;
    const g=ctx.createLinearGradient(e.s.x,e.s.y,e.t.x,e.t.y);
    g.addColorStop(0,hexA(GROUPS[e.s.g].color,on?(foc?.4:.13):.03));
    g.addColorStop(1,hexA(c,on?(foc?.6:.2):.04));
    ctx.strokeStyle=g;ctx.lineWidth=(on&&foc?1.7:1)*DPR;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(e.s.x,e.s.y);ctx.quadraticCurveTo(C.cx,C.cy,e.t.x,e.t.y);ctx.stroke();
  }
  // pulses
  ctx.globalCompositeOperation='lighter';
  for(let i=pulses.length-1;i>=0;i--){const pu=pulses[i];pu.p+=0.02;
    const a=pu.fwd?pu.e.s:pu.e.t,b=pu.fwd?pu.e.t:pu.e.s;
    if(pu.p>=1){if(!hidden.has(b.g))b.flash=1;pulses.splice(i,1);continue;}
    if(hidden.has(a.g)||hidden.has(b.g))continue;
    const C=ctrl(pu.e),t=pu.fwd?pu.p:1-pu.p,P=bez(pu.e.s,C,pu.e.t,t),c=GROUPS[b.g].color,rr=3.6*DPR;
    const gg=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,rr*3.5);
    gg.addColorStop(0,hexA(c,.9));gg.addColorStop(1,hexA(c,0));
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(P.x,P.y,rr*3.5,0,7);ctx.fill();}
  ctx.globalCompositeOperation='source-over';

  // nodes as hexagons + degree ring
  for(const n of nodes){
    if(hidden.has(n.g))continue;
    const c=GROUPS[n.g].color, isFoc=n===foc, inNeigh=foc&&neigh.has(n), searched=match(n);
    const dim=(foc&&!inNeigh)||(query&&!searched);
    const R=n.r*(isFoc?1.4:1)*(searched?1.25:1);
    // glow
    ctx.globalCompositeOperation='lighter';
    const glow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,R*3+(n.flash*R*2));
    glow.addColorStop(0,hexA(c,(dim?.05:.4)+n.flash*.4));glow.addColorStop(1,hexA(c,0));
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(n.x,n.y,R*3+(n.flash*R*2),0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    // degree ring
    ctx.strokeStyle=hexA(c,dim?.12:.5);ctx.lineWidth=1.4*DPR;
    hexPath(n.x,n.y,R*1.55,n.spin);ctx.stroke();
    // ticks around ring proportional to degree
    ctx.strokeStyle=hexA(c,dim?.1:.7);ctx.lineWidth=1.6*DPR;
    const tk=Math.min(n.deg,24);for(let k=0;k<tk;k++){const a=n.spin+k/tk*6.283;
      const r1=R*1.72,r2=R*1.95;ctx.beginPath();
      ctx.moveTo(n.x+Math.cos(a)*r1,n.y+Math.sin(a)*r1);
      ctx.lineTo(n.x+Math.cos(a)*r2,n.y+Math.sin(a)*r2);ctx.stroke();}
    // body hex
    const body=ctx.createRadialGradient(n.x-R*.3,n.y-R*.3,R*.1,n.x,n.y,R);
    body.addColorStop(0,hexA('#ffffff',dim?.15:.7));body.addColorStop(.5,hexA(c,dim?.3:1));
    body.addColorStop(1,hexA(c,dim?.12:.5));
    ctx.fillStyle=body;hexPath(n.x,n.y,R,n.spin);ctx.fill();
    ctx.strokeStyle=hexA(searched?'#ffffff':c,dim?.2:.9);ctx.lineWidth=(searched?2:1)*DPR;
    hexPath(n.x,n.y,R,n.spin);ctx.stroke();
    // inner core
    ctx.fillStyle=hexA('#04121a',dim?.3:.72);hexPath(n.x,n.y,R*.45,-n.spin);ctx.fill();
  }
  // labels
  ctx.textAlign='center';
  for(const n of nodes){
    if(hidden.has(n.g))continue;
    const show=n===foc||(foc&&neigh.has(n))||match(n)||(!foc&&!query&&n.deg>=7);
    if(!show)continue;
    ctx.font=`${(n===foc?13:11)*DPR}px "Rajdhani",sans-serif`;
    const y=n.y-n.r*(n===foc?1.4:1)-9*DPR;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(n.label,n.x+DPR,y+DPR);
    ctx.fillStyle=n===foc?'#fff':hexA(GROUPS[n.g].color,.92);ctx.fillText(n.label,n.x,y);
  }
  ctx.restore();
  minimap();
  requestAnimationFrame(draw);
}

// minimap bottom-center
function minimap(){
  const mw=150*DPR,mh=90*DPR,pad=12*DPR,mxp=W/2-mw/2,myp=H-mh-pad;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);}
  const sw=(x1-x0)||1,sh=(y1-y0)||1,s=Math.min((mw-8*DPR)/sw,(mh-8*DPR)/sh);
  ctx.fillStyle='rgba(4,12,18,.7)';ctx.strokeStyle='rgba(90,180,220,.22)';ctx.lineWidth=1*DPR;
  roundRect(mxp,myp,mw,mh,8*DPR);ctx.fill();ctx.stroke();
  const cx=mxp+mw/2-(x0+sw/2)*s, cy=myp+mh/2-(y0+sh/2)*s;
  for(const n of nodes){if(hidden.has(n.g))continue;
    ctx.fillStyle=hexA(GROUPS[n.g].color,.85);ctx.beginPath();
    ctx.arc(cx+n.x*s,cy+n.y*s,1.6*DPR,0,7);ctx.fill();}
  // viewport rect
  const vx=(-ox)/scale,vy=(-oy)/scale,vw=W/scale,vh=H/scale;
  ctx.strokeStyle='rgba(58,208,255,.6)';ctx.lineWidth=1*DPR;
  ctx.strokeRect(cx+vx*s,cy+vy*s,vw*s,vh*s);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ===== inspector ===== */
const insp=document.getElementById('insp');
function rowHtml(n){return `<div class="row" data-id="${n.id}"><i style="color:${GROUPS[n.g].color};background:${GROUPS[n.g].color}"></i>${n.id}</div>`;}
function openInsp(n){
  sel=n;
  document.getElementById('selInfo').innerHTML=`▸ <b style="color:${GROUPS[n.g].color}">${n.path}</b>`;
  document.getElementById('iName').textContent=n.path;
  document.getElementById('iDesc').textContent=n.desc;
  const chip=document.getElementById('iChip');
  chip.textContent=GROUPS[n.g].name+' · grado '+n.deg;
  chip.style.background=hexA(GROUPS[n.g].color,.16);chip.style.color=GROUPS[n.g].color;
  const out=edges.filter(e=>e.s===n).map(e=>e.t), inc=edges.filter(e=>e.t===n).map(e=>e.s);
  document.getElementById('iOutN').textContent=out.length;
  document.getElementById('iInN').textContent=inc.length;
  document.getElementById('iOut').innerHTML=out.length?out.map(rowHtml).join(''):'<div class="empty">no carga otros archivos</div>';
  document.getElementById('iIn').innerHTML=inc.length?inc.map(rowHtml).join(''):'<div class="empty">no la carga nadie (raíz)</div>';
  insp.style.display='block';insp.scrollTop=0;
  insp.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const t=byId[r.dataset.id];if(t){openInsp(t);focusNode(t);}});
}
function focusNode(n){scale=1.15;ox=W/2-n.x*scale;oy=H/2-n.y*scale;fire(n);}
document.getElementById('ix').onclick=()=>{insp.style.display='none';sel=null;
  document.getElementById('selInfo').textContent='— sin selección —';};

/* ===== interaction ===== */
function toWorld(cx,cy){return{x:(cx*DPR-ox)/scale,y:(cy*DPR-oy)/scale};}
function pick(cx,cy){const p=toWorld(cx,cy);let best=null,bd=1e9;
  for(const n of nodes){if(hidden.has(n.g))continue;const d=Math.hypot(n.x-p.x,n.y-p.y);
    if(d<Math.max(n.r*2,16*DPR)&&d<bd){bd=d;best=n;}}return best;}
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;
  if(drag){const p=toWorld(mx,my);drag.x=p.x;drag.y=p.y;return;}
  const n=pick(mx,my);hover=n;cv.style.cursor=n?'pointer':'default';
  if(n){tip.style.opacity=1;tip.style.left=Math.min(mx+14,innerWidth-220)+'px';tip.style.top=(my+14)+'px';
    tip.innerHTML=`<b>${n.path}</b> · ${n.deg} conex.`;}else tip.style.opacity=0;});
cv.addEventListener('mousedown',e=>{const n=pick(e.clientX,e.clientY);if(n)drag=n;});
addEventListener('mouseup',()=>{drag=null;});
cv.addEventListener('click',e=>{const n=pick(e.clientX,e.clientY);
  if(n)openInsp(n);else{insp.style.display='none';sel=null;document.getElementById('selInfo').textContent='— sin selección —';}});
cv.addEventListener('dblclick',e=>{const n=pick(e.clientX,e.clientY);if(n)fire(n);});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;
  const wx=(e.clientX*DPR-ox)/scale,wy=(e.clientY*DPR-oy)/scale;scale=Math.max(.3,Math.min(3.5,scale*f));
  ox=e.clientX*DPR-wx*scale;oy=e.clientY*DPR-wy*scale;},{passive:false});
cv.addEventListener('touchstart',e=>{const t=e.touches[0];const n=pick(t.clientX,t.clientY);if(n){drag=n;openInsp(n);}},{passive:true});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];if(drag){const p=toWorld(t.clientX,t.clientY);drag.x=p.x;drag.y=p.y;}},{passive:true});
addEventListener('touchend',()=>{drag=null;});

document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();});
document.getElementById('fire').onclick=fireGlobal;
document.getElementById('reset').onclick=()=>{scale=1;ox=oy=0;query='';document.getElementById('search').value='';
  insp.style.display='none';sel=null;document.getElementById('selInfo').textContent='— sin selección —';
  nodes.forEach(n=>{n.x=W/2+(Math.random()-.5)*W*.5;n.y=H/2+(Math.random()-.5)*H*.5;n.vx=n.vy=0;});};

draw();
setTimeout(fireGlobal,900);
</script>
</body>
